name: Compact child benchmark

on:
  push:
    branches:
      - 'feat/compact-children'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[compact-generated]')
    runs-on: ubuntu-latest
    outputs:
      prepared_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Apply compact child storage
        run: python3 scripts/apply_compact_children.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --release --locked
      - name: Commit generated implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs scripts/apply_compact_children.py
          if ! git diff --cached --quiet; then
            git commit -m 'Compact chance children [compact-generated]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: [self-hosted, linux, x64, mercy-bench]
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: '1'
    steps:
      - name: Checkout compact implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          path: compact
      - name: Checkout inline-edge HashMap baseline
        uses: actions/checkout@v5
        with:
          ref: 1e5dada6480b8f9aba9f1b1ffcad25076aab3a89
          path: baseline
      - name: Build baseline
        working-directory: baseline
        run: cargo build --release --locked
      - name: Build compact children
        working-directory: compact
        run: cargo build --release --locked
      - name: Paired deterministic benchmark
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PWD/baseline/target/release/bayes-2048"
          COMPACT="$PWD/compact/target/release/bayes-2048"
          OUT="$PWD/compact-child-benchmark"
          mkdir -p "$OUT/runs"
          echo 'budget,policy,seed,baseline_wall_ms,compact_wall_ms,speedup,baseline_sims_per_second,compact_sims_per_second,final_score,max_tile,moves,semantic_match' > "$OUT/pairs.csv"

          run_one() {
            local impl="$1" bin="$2" budget="$3" policy="$4" seed="$5"
            local dir="$OUT/runs/${impl}-${policy}-b${budget}-s${seed}"
            rm -rf "$dir"
            mkdir -p "$dir"
            "$bin" --games 1 --budgets "$budget" --policies "$policy" --seed "$seed" --out "$dir" --log-every 1 >/dev/null 2>&1
            tail -n 1 "$dir/games.csv"
          }

          run_one warm-baseline "$BASE" 64 uct 999 >/dev/null
          run_one warm-compact "$COMPACT" 64 uct 999 >/dev/null

          mismatch=0
          for budget in 128 512; do
            for policy in uct exact-voc; do
              for seed in 1 2 3 4 5 6; do
                if (( seed % 2 == 0 )); then
                  brow=$(run_one baseline "$BASE" "$budget" "$policy" "$seed")
                  crow=$(run_one compact "$COMPACT" "$budget" "$policy" "$seed")
                else
                  crow=$(run_one compact "$COMPACT" "$budget" "$policy" "$seed")
                  brow=$(run_one baseline "$BASE" "$budget" "$policy" "$seed")
                fi
                IFS=, read -r _ _ _ _ bscore btile bmoves bms bsps _ _ <<< "$brow"
                IFS=, read -r _ _ _ _ cscore ctile cmoves cms csps _ _ <<< "$crow"
                match=true
                if [[ "$bscore" != "$cscore" || "$btile" != "$ctile" || "$bmoves" != "$cmoves" ]]; then
                  match=false
                  mismatch=1
                fi
                speedup=$(awk -v b="$bms" -v c="$cms" 'BEGIN { printf "%.9f", b/c }')
                printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' \
                  "$budget" "$policy" "$seed" "$bms" "$cms" "$speedup" "$bsps" "$csps" "$cscore" "$ctile" "$cmoves" "$match" >> "$OUT/pairs.csv"
                printf 'B=%3s %-9s seed=%s: %7.3fs -> %7.3fs  speedup=%6.3fx  match=%s\n' \
                  "$budget" "$policy" "$seed" "$(awk -v x="$bms" 'BEGIN{print x/1000}')" "$(awk -v x="$cms" 'BEGIN{print x/1000}')" "$speedup" "$match"
              done
            done
          done

          awk -F, '
            BEGIN { print "budget,policy,n,baseline_total_s,compact_total_s,aggregate_speedup,mean_pair_speedup,all_semantic_match" }
            NR > 1 {
              key=$1 SUBSEP $2; n[key]++; b[key]+=$4; c[key]+=$5; sp[key]+=$6; if ($12 != "true") bad[key]=1
            }
            END {
              for (key in n) {
                split(key,p,SUBSEP)
                printf "%s,%s,%d,%.9f,%.9f,%.9f,%.9f,%s\n", p[1],p[2],n[key],b[key]/1000,c[key]/1000,b[key]/c[key],sp[key]/n[key],(bad[key]?"false":"true")
              }
            }
          ' "$OUT/pairs.csv" | sort -t, -k1,1n -k2,2 > "$OUT/summary.tmp"
          head -n 1 "$OUT/summary.tmp" > "$OUT/summary.csv"
          tail -n +2 "$OUT/summary.tmp" >> "$OUT/summary.csv"
          rm "$OUT/summary.tmp"
          cat "$OUT/summary.csv"

          if (( mismatch != 0 )); then
            echo 'ERROR: compact child storage changed deterministic game outcomes' >&2
            exit 2
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bayes-2048-compact-child-benchmark
          path: compact-child-benchmark
          if-no-files-found: error
          retention-days: 30
