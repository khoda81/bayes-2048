name: Arena tree benchmark

on:
  push:
    branches:
      - 'feat/arena-tree'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[arena-generated]')
    runs-on: ubuntu-latest
    outputs:
      prepared_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Apply arena refactor
        run: python scripts/apply_arena_tree.py

      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --release --locked

      - name: Commit generated arena implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs scripts/apply_arena_tree.py
          if ! git diff --cached --quiet; then
            git commit -m 'Arena-allocate MCTS nodes [arena-generated]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: [self-hosted, linux, x64, mercy-bench]
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: '1'
    steps:
      - name: Checkout arena implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          path: arena

      - name: Checkout boxed-tree baseline
        uses: actions/checkout@v5
        with:
          ref: e757dbbd729cfc56c9ac482e317cef20cb7b8eda
          path: baseline

      - name: Build baseline
        working-directory: baseline
        run: cargo build --release --locked

      - name: Build arena
        working-directory: arena
        run: cargo build --release --locked

      - name: Paired deterministic benchmark
        shell: bash
        run: |
          set -euo pipefail
          python arena/scripts/bench_arena.py \
            baseline/target/release/bayes-2048 \
            arena/target/release/bayes-2048 \
            arena-benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bayes-2048-arena-benchmark
          path: arena-benchmark
          if-no-files-found: error
          retention-days: 30
