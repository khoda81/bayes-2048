name: Analytic VOC experiment

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:
    inputs:
      games:
        description: 'Games per budget'
        required: false
        default: '100'
      budgets:
        description: 'Comma-separated simulations per move'
        required: false
        default: '64,128,256,512'

permissions:
  contents: write

concurrency:
  group: bayes-2048-analytic-voc
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[analytic-voc-generated]')
    runs-on: ubuntu-latest
    outputs:
      prepared_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Materialize analytic VOC implementation
        run: python scripts/apply_analytic_voc.py

      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --release

      - name: Commit implementation to feature branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock README.md plot.py src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Implement analytic VOC [analytic-voc-generated]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    runs-on: [self-hosted, linux, x64, mercy-bench]
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}

      - name: Toolchain info
        run: |
          rustc --version --verbose
          cargo --version
          uname -a
          lscpu

      - name: Run analytic VOC sweep
        shell: bash
        run: |
          set -euo pipefail
          GAMES="${{ github.event.inputs.games || '100' }}"
          BUDGETS="${{ github.event.inputs.budgets || '64,128,256,512' }}"
          cargo run --release --locked -- \
            --games "$GAMES" \
            --budgets "$BUDGETS" \
            --policies exact-voc \
            --log-every 25 \
            --out results-exact

      - name: Upload analytic VOC results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bayes-2048-analytic-voc-results
          path: results-exact/games.csv
          if-no-files-found: warn
          retention-days: 30
